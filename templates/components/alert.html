{# Reusable Alert / Banner Component #}
<div class="alert alert-{{ alert_type|default('info') }}" role="alert">
  <div class="alert-icon">
    {% if alert_type == 'error' %}⚠️
    {% elif alert_type == 'warning' %}⚡
    {% elif alert_type == 'success' %}✓
    {% else %}ℹ{% endif %}
  </div>
  <div class="alert-body">
    {% if alert_title %}<div class="alert-title">{{ alert_title }}</div>{% endif %}
    <div class="alert-message">{{ alert_message }}</div>
  </div>
</div>
