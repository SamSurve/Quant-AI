{# Reusable HTMX Search Bar Component #}
<div class="search-box-wrapper" id="global-search-wrapper">
  <div class="search-input-container">
    <span class="search-input-icon" aria-hidden="true">🔍</span>
    <input 
      type="search" 
      id="global-symbol-search"
      name="q" 
      class="search-input font-mono" 
      placeholder="Search symbol or company (e.g. AAPL, NVDA, Tesla)..." 
      value="{{ search_query|default('') }}"
      autocomplete="off"
      aria-label="Search ticker symbol or company name"
      hx-get="/search" 
      hx-trigger="keyup changed delay:300ms, search" 
      hx-target="#search-results-dropdown" 
      hx-indicator="#search-loading-spinner"
    >
    <div id="search-loading-spinner" class="htmx-indicator search-spinner" aria-hidden="true"></div>
  </div>
  <div id="search-results-dropdown" class="search-dropdown" role="region" aria-live="polite">
    {# Results loaded via HTMX #}
  </div>
</div>
